<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>august/cedash</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .setup-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .setup-card {
            background: linear-gradient(145deg, var(--surface-raised), var(--surface));
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .setup-step {
            display: none;
        }
        .setup-step.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .discord-btn {
            background: #5865F2; 
            color: white;
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2rem;
        }
        .discord-btn:hover { filter: brightness(1.15); }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            
            <div id="step-1" class="setup-step active">
                <p class="eyebrow">step 1</p>
                <h2>August's CE Dash</h2>
                <p class="page-intro">Connect your Discord account to get started.</p>
                <button class="discord-btn" onclick="window.location.href='/api/auth/discord'">
                    <i class="fa-brands fa-discord"></i> Sign in with Discord
                </button>
            </div>

            <div id="step-2" class="setup-step">
                <p class="eyebrow">Configuration</p>
                <h2>Dash API Key</h2>
                <p class="page-intro" style="margin-bottom: 2rem;">Enter your personal Orion Dash API key. It will be encrypted and stored securely.</p>
                
                <input type="password" id="api-key-input" class="text-input" placeholder="API Key..." style="margin-bottom: 1rem; text-align: center;">
                
                <button style="width: 100%; padding: 0.8rem;" onclick="submitApiKey()">
                    Complete Setup <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
                </button>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('step') === '2') {
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-2').classList.add('active');
        }
        if (urlParams.get('error') === 'unauthorized') {
            alert('You are not authorized to use this website.');
        }

        async function submitApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return;

            const res = await fetch('/api/auth/finalize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dashApiKey: key })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                const data = await res.json().catch(() => ({}));
                alert(data.error || 'Session expired or invalid. Please try again.');
            }
        }
    </script>
</body>
</html>
